# Continuous integration: build, type-check, test, and smoke-test the packed library on every push
# and pull request against main, across the supported Node.js versions on Linux, macOS, and Windows.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled, but every push to main finishes, so each commit on main
  # keeps the completed CI result a release requires.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        include:
          # The repository-wide checks look at files and the dependency tree rather than the platform,
          # so they run once, on this lane.
          - os: ubuntu-latest
            node-version: 24
            primary: true
          - os: macos-latest
            node-version: 22
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 22
          - os: windows-latest
            node-version: 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whitespace check diffs a commit range, so only its lane needs history.
          fetch-depth: ${{ matrix.primary && '0' || '1' }}
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Repository quality checks
        if: matrix.primary
        run: npm run verify:commit

      - name: Check committed whitespace
        if: matrix.primary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A force-pushed or pruned base commit is no longer in the fetched history, so fall back to
          # checking the head commit alone rather than failing the lane with "bad object".
          if [[ "$BASE_SHA" =~ ^0*$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA...$HEAD_SHA"
          fi

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      # The smoke test packs the dist the Build step produced. npm run test:package would rebuild it.
      - name: Verify the packed package
        run: node scripts/package-smoke.mjs

      - name: Audit all dependencies against the reviewed policy
        if: matrix.primary
        run: npm run audit:full

      - name: Audit runtime dependencies
        if: matrix.primary
        run: npm run audit:runtime

  ci-success:
    name: CI success
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform and Node.js lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
